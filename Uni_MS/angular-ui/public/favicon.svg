<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1D3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0E4D64;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A7A8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0B1D3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1D3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E4D64;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle border -->
  <circle cx="16" cy="16" r="15.5" fill="none" stroke="#C0C0C0" stroke-width="0.3" opacity="0.6"/>
  <circle cx="16" cy="16" r="15" fill="white"/>

  <!-- Graduation Cap -->
  <path d="M16,4 L21.5,6.5 L16,8 L10.5,6.5 Z" fill="url(#capGrad)"/>
  <path d="M11.5,6.5 L20.5,6.5 L20,7.5 L12,7.5 Z" fill="url(#tealGrad)"/>
  <path d="M10.5,6.5 L11.5,6.5 L12,7.5 L11.2,7.7 Z" fill="#0E4D64"/>
  <path d="M20.5,6.5 L21.5,6.5 L20.8,7.7 L20,7.5 Z" fill="#1A7A8A"/>
  <path d="M12,7.5 L20,7.5 L19.7,8 L12.3,8 Z" fill="#0B1D3A"/>

  <!-- Tassel -->
  <path d="M20,6.5 Q21.5,7.2 21.8,8.2" fill="none" stroke="#9CA3AF" stroke-width="0.4" stroke-linecap="round"/>
  <circle cx="21.9" cy="8.4" r="0.4" fill="#9CA3AF"/>

  <!-- Sparkle -->
  <circle cx="21.5" cy="5" r="0.5" fill="#1A7A8A"/>
  <line x1="21.5" y1="5" x2="21.5" y2="3.5" stroke="#1A7A8A" stroke-width="0.3"/>
  <line x1="21.5" y1="5" x2="23" y2="4.2" stroke="#1A7A8A" stroke-width="0.3"/>
  <line x1="21.5" y1="5" x2="23.2" y2="5.2" stroke="#1A7A8A" stroke-width="0.3"/>
  <line x1="21.5" y1="5" x2="22.5" y2="6" stroke="#1A7A8A" stroke-width="0.3"/>
  <circle cx="21.5" cy="3.3" r="0.35" fill="#1A7A8A"/>
  <circle cx="23.2" cy="4" r="0.35" fill="#1A7A8A"/>
  <circle cx="23.4" cy="5.3" r="0.35" fill="#1A7A8A"/>

  <!-- U letter with arrow -->
  <path d="M8.5,9.5 L8.5,15 Q8.5,17.2 10.5,17.2 L10.5,17.2 Q11,17.2 11.2,16.8" 
        fill="none" stroke="url(#darkGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8.5,9 L7.5,8 L8.5,7" fill="none" stroke="url(#darkGrad)" stroke-width="0.7" stroke-linecap="round"/>
  <path d="M7.2,8.5 L7.5,8 L7.1,7.6" fill="url(#darkGrad)"/>

  <!-- M letter -->
  <path d="M12,17.2 L12,9.5 L14,13 L16,9.5 L16,17.2" 
        fill="none" stroke="url(#darkGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- S letter -->
  <path d="M19,11.5 Q19,9.8 17,9.8 Q15,9.8 15,11.5 Q15,13.2 17,13.8 Q19,14.4 19,16 Q19,17.8 17,17.8 Q15.5,17.8 15,17.2" 
        fill="none" stroke="url(#darkGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Book -->
  <path d="M9.5,18.5 Q12.5,17.8 16,18.5 L16,20.5 Q12.5,19.8 9.5,20.5 Z" fill="url(#bookLeft)"/>
  <path d="M16,18.5 Q19.5,17.8 22.5,18.5 L22.5,20.5 Q19.5,19.8 16,20.5 Z" fill="url(#tealGrad)"/>
  <line x1="16" y1="18.3" x2="16" y2="20.7" stroke="white" stroke-width="0.2" opacity="0.4"/>
</svg>