<div class="login-container">
  <a routerLink="/" class="back-home">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Back to Home
  </a>
  <div class="login-card">
    <div class="brand-section">
      <h1 class="brand-title">UMS-ERP</h1>
      <p class="brand-subtitle">Smart University</p>
      <p class="brand-tagline">Intelligent Campus Management</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <input
            id="username"
            type="text"
            formControlName="username"
            placeholder="Enter your username"
            [class.error]="loginForm.get('username')?.touched && loginForm.get('username')?.invalid"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper password-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password"
            [class.error]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            tabindex="-1"
          >
            <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <div class="form-footer">
          <label class="remember-me">
            <input type="checkbox" formControlName="rememberMe" />
            <span>Remember Me</span>
          </label>
          <a routerLink="/forgot-password" class="forgot-link">Forgot Password?</a>
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-banner">
        <span>&#9888;</span> {{ errorMessage }}
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading || loginForm.invalid">
        <span *ngIf="loading" class="spinner"></span>
        <span>{{ loading ? 'Signing in...' : 'Sign In' }}</span>
      </button>
    </form>

    <div class="demo-accounts">
      <p class="demo-title">Demo Accounts</p>
      <div class="demo-list">
        <button type="button" class="demo-btn" (click)="fillDemo('superadmin', 'admin123')">
          <span class="demo-role">Super Admin</span>
          <span class="demo-creds">superadmin / admin123</span>
        </button>
        <button type="button" class="demo-btn" (click)="fillDemo('registrar', 'registrar123')">
          <span class="demo-role">Registrar</span>
          <span class="demo-creds">registrar / registrar123</span>
        </button>
        <button type="button" class="demo-btn" (click)="fillDemo('hrmanager', 'hr123')">
          <span class="demo-role">HR Manager</span>
          <span class="demo-creds">hrmanager / hr123</span>
        </button>
      </div>
    </div>
  </div>
</div>
