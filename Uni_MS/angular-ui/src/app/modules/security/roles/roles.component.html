<style>
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  .page-header h2 { margin: 0; font-size: 1.5rem; color: #1a1a2e; }
  .btn { padding: 0.5rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.875rem; display: inline-flex; align-items: center; gap: 0.375rem; }
  .btn-primary { background: #4361ee; color: #fff; }
  .btn-primary:hover { background: #3a56d4; }
  .btn-ghost { background: transparent; color: #4361ee; border: 1px solid #4361ee; }
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .modal { background: #fff; border-radius: 8px; padding: 1.5rem; width: 550px; max-height: 80vh; overflow-y: auto; }
  .modal h3 { margin-top: 0; }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; margin-bottom: 0.25rem; font-weight: 500; font-size: 0.875rem; }
  .form-group input[type="text"], .form-group input[type="code"] { width: 100%; padding: 0.5rem; border: 1px solid #dee2e6; border-radius: 4px; font-size: 0.875rem; box-sizing: border-box; }
  .form-group textarea { width: 100%; padding: 0.5rem; border: 1px solid #dee2e6; border-radius: 4px; font-size: 0.875rem; box-sizing: border-box; resize: vertical; }
  .form-group input[type="checkbox"] { margin-right: 0.5rem; }
  .form-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
  .perm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem; max-height: 200px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 4px; padding: 0.5rem; }
  .perm-item { display: flex; align-items: center; gap: 0.375rem; font-size: 0.8125rem; padding: 0.125rem 0; }
  .perm-item label { margin: 0; font-weight: normal; }
</style>

<div class="page-header">
  <app-toast></app-toast>
  <h2>Roles</h2>
  <button class="btn btn-primary" (click)="openCreate()">+ Add New</button>
</div>

<app-data-table
  (onEdit)="openForm($event)"
  [columns]="columns"
  [data]="pagedData?.content || []"
  [pagedData]="pagedData"
  [loading]="loading"
  [params]="params"
  (pageChange)="onPageChange($event)"
  (onDelete)="delete($event.id)"
></app-data-table>

@if (showModal) {
  <div class="modal-overlay" (click)="showModal = false">
    <div class="modal" (click)="$event.stopPropagation()">
      <h3>{{ isEditing ? 'Edit Role' : 'Create Role' }}</h3>
      <div class="form-group">
        <label>Name</label>
        <input type="text" [(ngModel)]="selectedRole.name" placeholder="e.g. Administrator">
      </div>
      <div class="form-group">
        <label>Code</label>
        <input type="text" [(ngModel)]="selectedRole.code" placeholder="e.g. ADMIN">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea [(ngModel)]="selectedRole.description" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label><input type="checkbox" [(ngModel)]="selectedRole.active"> Active</label>
      </div>
      <div class="form-group">
        <label>Permissions</label>
        <div class="perm-grid">
          @for (perm of allPermissions; track perm.id) {
            <div class="perm-item">
              <input type="checkbox" [checked]="hasPermission(perm.id!)" (change)="togglePermission(perm.id!)">
              <label>{{ perm.code }}</label>
            </div>
          }
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" (click)="showModal = false">Cancel</button>
        <button class="btn btn-primary" (click)="save()">{{ isEditing ? 'Update' : 'Create' }}</button>
      </div>
    </div>
  </div>
}


<app-dynamic-form 
  *ngIf="showForm" 
  [columns]="columns" 
  [initialData]="editingItem" 
  [title]="editingItem ? 'Edit Record' : 'Add New Record'"
  (save)="saveItem($event)" 
  (cancel)="showForm = false">
</app-dynamic-form>
