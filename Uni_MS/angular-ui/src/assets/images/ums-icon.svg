<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="250" height="250">
  <defs>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1D3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0E4D64;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A7A8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0B1D3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1D3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E4D64;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle border -->
  <circle cx="125" cy="125" r="123" fill="none" stroke="#C0C0C0" stroke-width="1" opacity="0.6"/>
  <circle cx="125" cy="125" r="121" fill="white"/>

  <!-- Graduation Cap -->
  <path d="M125,40 L170,62 L125,78 L80,62 Z" fill="url(#capGrad)"/>
  <path d="M88,62 L162,62 L157,72 L93,72 Z" fill="url(#tealGrad)"/>
  <path d="M80,62 L88,62 L93,72 L86,74 Z" fill="#0E4D64"/>
  <path d="M162,62 L170,62 L165,74 L157,72 Z" fill="#1A7A8A"/>
  <path d="M93,72 L157,72 L154,79 L96,79 Z" fill="#0B1D3A"/>

  <!-- Tassel -->
  <path d="M160,62 Q170,70 172,82" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="173" cy="84" r="2.5" fill="#9CA3AF"/>
  <path d="M173,86.5 L170,97 M173,86.5 L173,99 M173,86.5 L176,97" stroke="#9CA3AF" stroke-width="1" stroke-linecap="round"/>

  <!-- Sparkle/atom -->
  <g transform="translate(170, 42)">
    <circle cx="0" cy="0" r="2.5" fill="#1A7A8A"/>
    <line x1="0" y1="0" x2="0" y2="-9" stroke="#1A7A8A" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="7.5" y2="-5" stroke="#1A7A8A" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="9" y2="1" stroke="#1A7A8A" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="6" y2="7" stroke="#1A7A8A" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="-4" y2="-8" stroke="#1A7A8A" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="-8" y2="-3" stroke="#1A7A8A" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="-7" y2="5" stroke="#1A7A8A" stroke-width="1.2"/>
    <circle cx="0" cy="-10" r="2" fill="#1A7A8A"/>
    <circle cx="8.5" cy="-6" r="2" fill="#1A7A8A"/>
    <circle cx="10" cy="2" r="2" fill="#1A7A8A"/>
    <circle cx="7" cy="8" r="2" fill="#1A7A8A"/>
    <circle cx="-5" cy="-9" r="2" fill="#1A7A8A"/>
    <circle cx="-9" cy="-4" r="2" fill="#1A7A8A"/>
    <circle cx="-8" cy="6" r="2" fill="#1A7A8A"/>
  </g>

  <!-- UMS Letters with integrated book -->
  <!-- U letter with upward arrow -->
  <path d="M65,92 L65,145 Q65,168 88,168 L88,168 Q93,168 95,164" 
        fill="none" stroke="url(#darkGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M65,87 L57,77 L65,67" fill="none" stroke="url(#darkGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M53,82 L57,77 L52,73" fill="url(#darkGrad)"/>

  <!-- M letter -->
  <path d="M100,168 L100,92 L122,135 L144,92 L144,168" 
        fill="none" stroke="url(#darkGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- S letter -->
  <path d="M175,110 Q175,92 155,92 Q135,92 135,110 Q135,128 155,135 Q175,142 175,160 Q175,178 155,178 Q139,178 135,170" 
        fill="none" stroke="url(#darkGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Open book at bottom -->
  <path d="M75,185 Q100,179 125,185 L125,208 Q100,202 75,208 Z" fill="url(#bookLeft)"/>
  <path d="M125,185 Q150,179 175,185 L175,208 Q150,202 125,208 Z" fill="url(#tealGrad)"/>
  <line x1="125" y1="183" x2="125" y2="210" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="82" y1="193" x2="120" y2="190" stroke="white" stroke-width="0.5" opacity="0.25"/>
  <line x1="82" y1="199" x2="120" y2="196" stroke="white" stroke-width="0.5" opacity="0.25"/>
  <line x1="130" y1="190" x2="168" y2="193" stroke="white" stroke-width="0.5" opacity="0.25"/>
  <line x1="130" y1="196" x2="168" y2="199" stroke="white" stroke-width="0.5" opacity="0.25"/>

  <!-- University Management System text -->
  <text x="125" y="235" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#0B1D3A" letter-spacing="1">University Management System</text>
</svg>