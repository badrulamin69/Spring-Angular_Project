<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1D3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0E4D64;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A7A8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0B1D3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1D3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E4D64;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle border -->
  <circle cx="250" cy="250" r="248" fill="none" stroke="#C0C0C0" stroke-width="2" opacity="0.6"/>
  <circle cx="250" cy="250" r="244" fill="white"/>

  <!-- Graduation Cap - main diamond shape -->
  <path d="M250,80 L340,125 L250,155 L160,125 Z" fill="url(#capGrad)"/>
  <!-- Cap front face -->
  <path d="M175,125 L325,125 L315,145 L185,145 Z" fill="url(#tealGrad)"/>
  <!-- Cap left side -->
  <path d="M160,125 L175,125 L185,145 L170,148 Z" fill="#0E4D64"/>
  <!-- Cap right side -->
  <path d="M325,125 L340,125 L330,148 L315,145 Z" fill="#1A7A8A"/>
  <!-- Cap bottom edge -->
  <path d="M185,145 L315,145 L310,158 L190,158 Z" fill="#0B1D3A"/>

  <!-- Tassel string -->
  <path d="M320,125 Q340,140 345,165" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
  <!-- Tassel end -->
  <circle cx="346" cy="168" r="5" fill="#9CA3AF"/>
  <path d="M346,173 L340,195 M346,173 L346,198 M346,173 L352,195" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>

  <!-- Sparkle/atom on top-right -->
  <g transform="translate(340, 85)">
    <circle cx="0" cy="0" r="5" fill="#1A7A8A"/>
    <line x1="0" y1="0" x2="0" y2="-18" stroke="#1A7A8A" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="15" y2="-10" stroke="#1A7A8A" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="18" y2="2" stroke="#1A7A8A" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="12" y2="14" stroke="#1A7A8A" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="-8" y2="-16" stroke="#1A7A8A" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="-16" y2="-6" stroke="#1A7A8A" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="-14" y2="10" stroke="#1A7A8A" stroke-width="2.5"/>
    <circle cx="0" cy="-20" r="4" fill="#1A7A8A"/>
    <circle cx="17" cy="-12" r="4" fill="#1A7A8A"/>
    <circle cx="20" cy="4" r="4" fill="#1A7A8A"/>
    <circle cx="14" cy="16" r="4" fill="#1A7A8A"/>
    <circle cx="-10" cy="-18" r="4" fill="#1A7A8A"/>
    <circle cx="-18" cy="-8" r="4" fill="#1A7A8A"/>
    <circle cx="-16" cy="12" r="4" fill="#1A7A8A"/>
  </g>

  <!-- UMS Letters with integrated book -->
  <!-- U letter with upward arrow -->
  <path d="M130,185 L130,290 Q130,335 175,335 L175,335 Q185,335 190,328" 
        fill="none" stroke="url(#darkGrad)" stroke-width="35" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow on U left side -->
  <path d="M130,175 L115,155 L130,135" fill="none" stroke="url(#darkGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M108,165 L115,155 L105,148" fill="url(#darkGrad)"/>

  <!-- M letter -->
  <path d="M200,335 L200,185 L245,270 L290,185 L290,335" 
        fill="none" stroke="url(#darkGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- S letter -->
  <path d="M350,220 Q350,185 310,185 Q270,185 270,220 Q270,255 310,270 Q350,285 350,320 Q350,355 310,355 Q278,355 270,340" 
        fill="none" stroke="url(#darkGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Open book at bottom -->
  <!-- Left page -->
  <path d="M150,370 Q200,358 250,370 L250,415 Q200,403 150,415 Z" fill="url(#bookLeft)"/>
  <!-- Right page -->
  <path d="M250,370 Q300,358 350,370 L350,415 Q300,403 250,415 Z" fill="url(#tealGrad)"/>
  <!-- Book spine -->
  <line x1="250" y1="367" x2="250" y2="418" stroke="white" stroke-width="2" opacity="0.4"/>
  <!-- Page lines left -->
  <line x1="165" y1="385" x2="240" y2="378" stroke="white" stroke-width="1" opacity="0.25"/>
  <line x1="165" y1="395" x2="240" y2="388" stroke="white" stroke-width="1" opacity="0.25"/>
  <line x1="165" y1="405" x2="240" y2="398" stroke="white" stroke-width="1" opacity="0.25"/>
  <!-- Page lines right -->
  <line x1="260" y1="378" x2="335" y2="385" stroke="white" stroke-width="1" opacity="0.25"/>
  <line x1="260" y1="388" x2="335" y2="395" stroke="white" stroke-width="1" opacity="0.25"/>
  <line x1="260" y1="398" x2="335" y2="405" stroke="white" stroke-width="1" opacity="0.25"/>

  <!-- University Management System text -->
  <text x="250" y="460" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="26" font-weight="500" fill="#0B1D3A" letter-spacing="2">University Management System</text>
</svg>